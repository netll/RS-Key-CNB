#
# GitHub Actions 适配版「编译固件」流水线 —— 功能等价于 CNB 三件套
# (.cnb/web_trigger.yml 的表单 + .ci/firmware-build.Dockerfile 的环境
#  + .cnb.yml 的流水线)。
#
# 用法（GitHub 空仓库）：
#   1. 把本文件放到 `<repo>/.github/workflows/Actions.yml`；
#   2. 仓库 Actions 页面会出现「编译固件」workflow，点进去即为表单；
#   3. 填写构建参数、勾选 Cargo features，点「Run workflow」执行；
#   4. 流水线自动完成：clone 固件源码 → 进 nix 环境编译 → 嵌 RP2350 分区表
#      (fence KV store) → 转 UF2 → 以当前墙钟时间命名发布一个 GitHub Release
#      并上传 firmware.uf2。
#
# 说明：本 workflow 所在仓库通常只是“存放 Actions.yml”的空仓库，真正的固件源码
# 在 cnb.cool 的 netll/RS-Key。因此流水线会先把该源码完整克隆到
# $GITHUB_WORKSPACE/RS-Key，所有构建步骤都在其子目录 RS-Key 内执行——与你服务器
# 手动流程 `git clone https://cnb.cool/netll/RS-Key` + `cd RS-Key` + `nix develop`
# 完全对应。若把本文件放进一个本身就是完整 RS-Key 源码的仓库，也会直接复用
# 已存在的源码（见 clone-rs-key-source 步骤）。
#
# 与 CNB 版的对应关系：
#   - web_trigger 表单的 select/switch/input  → 下方 workflow_dispatch inputs
#     （choice 下拉、string 输入）；
#   - firmware-build.Dockerfile 的 nix + curl/jq → nix-installer-action + 按需安装；
#   - .cnb.yml 的 verify-env / build-firmware / partition-table / convert-uf2 /
#     create-release 五个 stage → 下方同名 job step。
#
# GitHub Actions 限制 workflow_dispatch 最多 25 个 inputs，因此相比 CNB 表单做了
# 三处合并（功能不变）：
#   - USR_LED_PIN + USR_LED_ACTIVE_HIGH → USR_LED（格式 `PIN[:极性]`）
#   - PRESENCE_PIN + PRESENCE_ACTIVE_HIGH → PRESENCE（格式 `PIN[:极性]`）
#   - WAKE_PIN + WAKE_ACTIVE_HIGH → WAKE（格式 `PIN[:极性]`）
#   - 8 个 Cargo feature 布尔开关 → 1 个 FEATURES 字符串（逗号分隔多选）
# 脚本在 build 前会把合并值拆回 build.rs 期望的独立环境变量。
#
# 注意：本文件是「自包含」的 —— 只依赖 runner 预装工具(git、gh)与官方/社区
# action，不引用仓库内部脚本，因此可直接复制进任意空仓库使用。
#
# 构建参数只在表单里真正填了值才会传给 cargo build。GitHub 的 choice 型 inputs
# 无法真正留空（必须设默认值），故把 BOARD 的 `custom`、LED_KIND/LED_ORDER 的
# `default` 视作“未选择具体项”，由 build-firmware 与 create-release 的 DFLT_MARK
# 过滤掉、不传入构建，让 build.rs 回落到源码默认；其余变量仅非空才传。

name: 编译固件

on:
  workflow_dispatch:
    inputs:
      # ─────────────────────────────────────────────────────────────────
      # 基础设置
      # ─────────────────────────────────────────────────────────────────
      BOARD:
        description: "开发板预设（引脚/闪存配置）。留空则手动指定下方各项"
        required: false
        type: choice
        default: "custom"
        options:
          - "custom"
          - "abrobot-4m"
          - "abrobot-16m"
          - "waveshare-one"
          - "waveshare-touch-lcd"
          - "tenstar-usb"
          - "seeed-xiao"
      VIDPID:
        description: "USB VID/PID 预设。RSKey 为项目自身身份；Yubikey5 等为本地互通用预设，勿对外分发"
        required: false
        type: choice
        default: "RSKey"
        options:
          - "RSKey"
          - "Yubikey5"
          - "YubikeyNeo"
          - "YubiHSM"
          - "NitroHSM"
          - "NitroFIDO2"
          - "NitroStart"
          - "NitroPro"
          - "Nitro3"
          - "Gnuk"
          - "GnuPG"
          - "Pico"
          - "Dev"
      FW_VERSION:
        description: "固件版本号（如 5.7.4），不影响 bcdDevice；留空则使用源码默认 5.7.4"
        required: false
        type: string
        default: ""
      FLASH_SIZE:
        description: "外部 QSPI flash 大小，如 4M / 8M / 16M；留空则使用源码默认 4M"
        required: false
        type: string
        default: ""
      KVMAIN:
        description: "KV main 分区大小，2MB 板子需改为 896K；留空则使用源码默认 1408K"
        required: false
        type: string
        default: ""
      XOSC_DELAY_MULT:
        description: "XOSC 启动延迟倍率（1..=1024）；留空则使用源码默认 128"
        required: false
        type: string
        default: ""

      # ─────────────────────────────────────────────────────────────────
      # USB 设置
      # ─────────────────────────────────────────────────────────────────
      USB_VID:
        description: "原始 USB VID 覆盖（如 0x1209），作用于预设之上"
        required: false
        type: string
        default: ""
      USB_PID:
        description: "原始 USB PID 覆盖（如 0x0001），作用于预设之上"
        required: false
        type: string
        default: ""
      USB_MANUFACTURER:
        description: "USB 描述符中的制造商字符串"
        required: false
        type: string
        default: ""
      USB_PRODUCT:
        description: "USB 描述符中的产品字符串"
        required: false
        type: string
        default: ""

      # ─────────────────────────────────────────────────────────────────
      # LED 设置
      # ─────────────────────────────────────────────────────────────────
      LED_KIND:
        description: "LED 驱动后端。none=无状态指示灯；留空则使用源码默认 ws2812"
        required: false
        type: choice
        default: "default"
        options:
          - "default"
          - "ws2812"
          - "gpio"
          - "pimoroni"
          - "none"
      LED_PIN:
        description: "状态 LED 的 GPIO 编号（ws2812/gpio 后端，0..=29）；留空则使用源码默认 16"
        required: false
        type: string
        default: ""
      LED_POWER_PIN:
        description: "可选：上电时拉高以供电的 GPIO（如 Seeed XIAO 的 GP23）"
        required: false
        type: string
        default: ""
      LED_ORDER:
        description: "WS2812 字节序。标准 WS2812B 用 grb，Waveshare 用 rgb；留空则使用源码默认 rgb"
        required: false
        type: choice
        default: "default"
        options:
          - "default"
          - "rgb"
          - "grb"
      MAX_LEDS:
        description: "可寻址 LED 数上限（1..=64）；留空则使用源码默认 1"
        required: false
        type: string
        default: ""
      USR_LED:
        description: "可选：启动时拉 OFF 的用户/状态 LED。格式 `PIN[:极性]`，如 `28` 或 `28:1`（极性 0=低有效，1=高有效，留空默认 0）"
        required: false
        type: string
        default: ""

      # ─────────────────────────────────────────────────────────────────
      # 按键 / 存在性设置
      # ─────────────────────────────────────────────────────────────────
      PRESENCE:
        description: "用户存在性输入源。`bootsel`=板载 BOOTSEL 按键，或指定 GPIO 编号，可带极性 `PIN[:极性]`（如 `5` 或 `5:1`，极性 0=低有效，1=高有效，留空默认 0）；留空则使用源码默认 bootsel"
        required: false
        type: string
        default: ""
      WAKE:
        description: "display 构建专用：从息屏唤醒的按键 GPIO，可带极性 `PIN[:极性]`（如 `9` 或 `9:1`）；留空则使用源码默认 25"
        required: false
        type: string
        default: ""

      # ─────────────────────────────────────────────────────────────────
      # Cargo Features（逗号分隔，可组合多选）
      # ─────────────────────────────────────────────────────────────────
      FEATURES:
        description: "逗号分隔的 Cargo features。可选：no-touch(自动确认，测试专用勿发布), advertise-pqc(公告 ML-DSA PQC), fips-profile(FIPS 策略), strong-pin(≥6位PIN), strict-up(每次要求按键), always-uv(默认要求用户验证), display(可信显示屏), strict-config(严格管理员授权)。留空=默认 touch 构建"
        required: false
        type: string
        default: ""

# 构建参数只有在表单里实际填了值才会传给 cargo build；空/默认值不传，让
# build.rs 回落到 crate 默认，从而让一个未配置的构建与纯 `cargo build --release
# -p firmware` 字节一致（等价于 CNB 版 build-firmware stage 的 BUILD_KNOBS 逻辑）。
#
# 注意：GitHub 的 choice 型 inputs 必须设默认值，无法真正置空；`custom`（BOARD）
# 与 `default`（LED_KIND/LED_ORDER）只是"未选择具体项"的占位，视为未填写，
# 是否传给构建由下方 build-firmware 脚本的 DFLT_MARK 过滤决定（这里一律原样透传）。
env:
  BOARD: ${{ inputs.BOARD }}
  VIDPID: ${{ inputs.VIDPID }}
  FW_VERSION: ${{ inputs.FW_VERSION }}
  FLASH_SIZE: ${{ inputs.FLASH_SIZE }}
  KVMAIN: ${{ inputs.KVMAIN }}
  XOSC_DELAY_MULT: ${{ inputs.XOSC_DELAY_MULT }}
  USB_VID: ${{ inputs.USB_VID }}
  USB_PID: ${{ inputs.USB_PID }}
  USB_MANUFACTURER: ${{ inputs.USB_MANUFACTURER }}
  USB_PRODUCT: ${{ inputs.USB_PRODUCT }}
  LED_KIND: ${{ inputs.LED_KIND }}
  LED_PIN: ${{ inputs.LED_PIN }}
  LED_POWER_PIN: ${{ inputs.LED_POWER_PIN }}
  LED_ORDER: ${{ inputs.LED_ORDER }}
  MAX_LEDS: ${{ inputs.MAX_LEDS }}
  USR_LED: ${{ inputs.USR_LED }}
  PRESENCE: ${{ inputs.PRESENCE }}
  WAKE: ${{ inputs.WAKE }}
  FEATURES: ${{ inputs.FEATURES }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write # 创建 Release + 上传 firmware.uf2

    steps:
      # 当前 checkout 的是「存放本 workflow 的仓库」——通常是你新建的 GitHub 空
      # 仓库，里面只有 .github/workflows/Actions.yml，并没有 RS-Key 源码。真正的
      # 固件源码在 cnb.cool 的 netll/RS-Key，因此下面单独把源码完整克隆到
      # $GITHUB_WORKSPACE/RS-Key，之后所有构建步骤都在该子目录内执行
      # （与你服务器手动流程的 `git clone https://cnb.cool/netll/RS-Key` +
      # `cd RS-Key` + `nix develop` 完全对应）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: clone-rs-key-source
        run: |
          set -e
          echo "===== Cloning RS-Key source from cnb.cool ====="
          if [ -e "$GITHUB_WORKSPACE/RS-Key/flake.nix" ]; then
            echo ">>> RS-Key source already present at $GITHUB_WORKSPACE/RS-Key — skip clone"
          else
            git clone --depth 1 https://cnb.cool/netll/RS-Key "$GITHUB_WORKSPACE/RS-Key"
            echo ">>> RS-Key source cloned -> $GITHUB_WORKSPACE/RS-Key"
          fi
          echo ">>> flake.nix: $(ls "$GITHUB_WORKSPACE/RS-Key/flake.nix")"

      # 等价于 .ci/firmware-build.Dockerfile：安装 Nix 并启用 flakes。
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('RS-Key/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RS-Key/target
          key: cargo-${{ runner.os }}-${{ hashFiles('RS-Key/Cargo.lock', 'RS-Key/flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: verify-env
        working-directory: RS-Key
        run: |
          echo "===== RS-Key firmware build (GitHub Actions) ====="
          echo ">>> Triggered by: ${{ github.actor }}"
          echo ">>> Ref: ${{ github.ref }} @ ${{ github.sha }}"
          echo ">>> Nix: $(nix --version 2>/dev/null || echo MISSING)"
          echo ">>> Received build knobs:"
          env | grep -E '^(BOARD|VIDPID|FW_VERSION|FLASH_SIZE|KVMAIN|XOSC_DELAY_MULT|USB_|LED_|USR_LED|PRESENCE|WAKE|FEATURES)' | sort || echo "    (none set — using crate defaults)"

      - name: build-firmware
        working-directory: RS-Key
        run: |
          set -e
          echo "===== cargo build (release, thumbv8m) ====="

          # 与 CNB 版一致：只有填了值(非空)的 knob 才传给构建；空值 unset，
          # 让 build.rs 回落到 crate 默认。
          #
          # 为把 workflow_dispatch inputs 控制在 GitHub 的 25 个上限内，以下几组
          # 在表单中合并为一个 `PIN[:极性]` 格式的输入，此处再拆回 build.rs 期望
          # 的独立环境变量：
          #   USR_LED  → USR_LED_PIN + USR_LED_ACTIVE_HIGH
          #   PRESENCE → PRESENCE_PIN + PRESENCE_ACTIVE_HIGH
          #   WAKE     → WAKE_PIN + WAKE_ACTIVE_HIGH
          split_pin_polarity() {
            # $1 = 合并值（`PIN[:极性]`，极性默认 0），$2 = PIN 变量名，$3 = 极性变量名
            local raw="${1:-}"
            if [ -z "$raw" ]; then
              return 0
            fi
            local pin="${raw%%:*}" pol="${raw#*:}"
            if [ "$pol" = "$raw" ]; then
              pol=""   # 无冒号 → 极性取默认
            fi
            env_args+=("$2=$pin")
            if [ -n "$pol" ]; then
              env_args+=("$3=$pol")
            fi
          }

          BUILD_KNOBS="BOARD VIDPID FW_VERSION FLASH_SIZE KVMAIN XOSC_DELAY_MULT \
                       USB_VID USB_PID USB_MANUFACTURER USB_PRODUCT \
                       LED_KIND LED_PIN LED_POWER_PIN LED_ORDER MAX_LEDS \
                       FAKE_MKEK FAKE_DEVK"

          # GitHub 表单的 choice 型 inputs 必须设默认值，无法真正留空。`custom`
          # （BOARD 的"手动指定"占位）与 `default`（LED_KIND/LED_ORDER 的"用源码
          # 默认"占位）都表示"未选择具体项"，视为未填写，不传给构建。其余变量
          # 只有非空才传入，空值 unset 让 build.rs 回落到 crate 默认。
          declare -A DFLT_MARK=( [BOARD]=custom [LED_KIND]=default [LED_ORDER]=default )
          env_args=()
          for kv in $BUILD_KNOBS; do
            v="${!kv:-}"
            mark="${DFLT_MARK[$kv]:-}"
            if [ -n "$v" ] && [ "$v" != "$mark" ]; then
              env_args+=("$kv=$v")
            else
              unset "$kv" || true
            fi
          done

          # 合并输入拆分（须在 env_args 初始化后调用）。
          split_pin_polarity "$USR_LED" USR_LED_PIN USR_LED_ACTIVE_HIGH
          split_pin_polarity "$PRESENCE" PRESENCE_PIN PRESENCE_ACTIVE_HIGH
          split_pin_polarity "$WAKE" WAKE_PIN WAKE_ACTIVE_HIGH

          # Cargo features（表单中逗号分隔 → cargo --features 逗号分隔列表）。
          # 支持：no-touch advertise-pqc fips-profile strong-pin strict-up
          #      always-uv display strict-config
          feats=()
          IFS=',' read -ra _feat_in <<< "${FEATURES:-}"
          for _f in "${_feat_in[@]}"; do
            _f="$(echo "$_f" | xargs)"   # 去首尾空白
            [ -n "$_f" ] && feats+=("$_f")
          done

          if [ ${#env_args[@]} -gt 0 ]; then
            echo ">>> Build knobs passed:"
            printf '    %s\n' "${env_args[@]}"
          else
            echo ">>> Build knobs: (none — using crate defaults)"
          fi

          if [ ${#feats[@]} -gt 0 ]; then
            FEATURES="$(IFS=,; echo "${feats[*]}")"
            echo ">>> Cargo features: $FEATURES"
            if [ ${#env_args[@]} -gt 0 ]; then
              env "${env_args[@]}" nix develop -c cargo build --release -p firmware --features "$FEATURES"
            else
              nix develop -c cargo build --release -p firmware --features "$FEATURES"
            fi
          else
            echo ">>> Cargo features: (none — default touch build)"
            if [ ${#env_args[@]} -gt 0 ]; then
              env "${env_args[@]}" nix develop -c cargo build --release -p firmware
            else
              nix develop -c cargo build --release -p firmware
            fi
          fi

      - name: partition-table
        working-directory: RS-Key
        run: |
          set -e
          echo "===== Embed RP2350 partition table ====="
          ELF=target/thumbv8m.main-none-eabihf/release/firmware
          nix develop -c scripts/pt.sh "$ELF" firmware-pt.elf
          echo ">>> partition table embedded -> firmware-pt.elf"

      - name: convert-uf2
        working-directory: RS-Key
        run: |
          set -e
          echo "===== Convert ELF -> UF2 ====="
          nix develop -c picotool uf2 convert firmware-pt.elf -t elf firmware.uf2
          ls -lh firmware.uf2
          echo ">>> firmware.uf2 ready"

      - name: create-release
        working-directory: RS-Key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "===== Publish Release ====="

          # 1. 以当前墙钟时间命名 tag / Release（与 CNB 版一致）。
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          TAG="firmware-$TIMESTAMP"
          echo ">>> Release tag: $TAG"

          # 2. SHA-256。
          SHA256="$(sha256sum firmware.uf2 | cut -d' ' -f1)"
          echo ">>> SHA-256: $SHA256"

          # 3. 组装构建参数文本用于 Release 说明（同样过滤掉 choice 占位默认值，
          #    与 build-firmware 的 DFLT_MARK 保持一致）。
          declare -A DFLT_MARK=( [BOARD]=custom [LED_KIND]=default [LED_ORDER]=default )
          build_env_text=""
          for kv in BOARD VIDPID FW_VERSION FLASH_SIZE KVMAIN XOSC_DELAY_MULT \
                     USB_VID USB_PID USB_MANUFACTURER USB_PRODUCT \
                     LED_KIND LED_PIN LED_POWER_PIN LED_ORDER MAX_LEDS \
                     USR_LED PRESENCE WAKE; do
            v="${!kv:-}"
            mark="${DFLT_MARK[$kv]:-}"
            if [ -n "$v" ] && [ "$v" != "$mark" ]; then
              build_env_text="${build_env_text} ${kv}=${v}"
            fi
          done
          build_env_text="${build_env_text# }"
          [ -n "$build_env_text" ] || build_env_text="(defaults)"

          # features 已在表单中以逗号分隔字符串给出，直接透传到 Release 说明。
          features_text="${FEATURES:-}"
          [ -n "$features_text" ] || features_text="(none — default touch build)"

          BODY=$'RS-Key firmware build for RP2350.\n\n'
          BODY+="**Build time:** \`${TIMESTAMP}\`"$'\n'
          BODY+="**Commit:** \`${GITHUB_SHA:0:7}\`"$'\n'
          BODY+="**Build env:** \`${build_env_text}\`"$'\n'
          BODY+="**Cargo features:** \`${features_text}\`"$'\n'
          BODY+="**SHA-256:** \`${SHA256}\`"$'\n'
          BODY+=$'\n**Artifact:** `firmware.uf2` (RP2350, partition table fenced)\n'

          # 仅对本地互通用的 VIDPID 预设给出分发警告。
          case "${VIDPID:-}" in
            Yubikey5|YubikeyNeo|YubiHSM)
              vid="${VIDPID}"
              BODY+=$'\n> ⚠️ Per repo docs, the `'"${vid}"$'` VIDPID preset is meant for local interop testing only and is **not** for distribution.\n';;
          esac

          # 4. 创建 GitHub Release 并上传 firmware.uf2。
          #    GitHub 不允许同名 tag 的 Release 覆盖，时间戳到秒已保证唯一；
          #    若恰好同秒重跑失败，下方会明确报错。
          echo ">>> Creating GitHub Release..."
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "RS-Key Firmware $TAG" \
            --notes "$BODY" \
            firmware.uf2

          echo
          echo "===== DONE ====="
          echo ">>> Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo ">>> SHA-256: $SHA256"
